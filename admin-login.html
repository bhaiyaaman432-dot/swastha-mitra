<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Swastha Mitra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --green: #087f5b;
            --navy: #0a2540;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #153b60 100%);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); width: 100%; max-width: 350px;
            text-align: center;
        }
        .login-box i.icon-top { font-size: 50px; color: var(--green); margin-bottom: 10px; }
        .login-box h2 { color: var(--navy); margin-top: 0; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 14px; color: #94a3b8; }
        .input-group input {
            width: 100%; padding: 12px 15px 12px 45px; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
        }
        .input-group input:focus { border-color: var(--green); outline: none; }
        .btn-login {
            background: var(--green); color: white; width: 100%; padding: 12px;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-login:hover { background: var(--navy); }
        #errMsg { color: #dc2626; margin-top: 15px; font-size: 14px; font-weight: bold; }
        
        /* 🔴 Naya CSS sirf OTP box ko chupane ke liye */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-box">
        <i class="fa-solid fa-shield-halved icon-top"></i>
        <h2>Admin Portal</h2>
        
        <form id="adminLoginForm">
            <!-- Username Box -->
            <div class="input-group" id="userGroup">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Admin Username" required>
            </div>
            
            <!-- Password Box -->
            <div class="input-group" id="passGroup">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Admin Password" required>
            </div>
            
            <!-- 🔴 Naya: OTP Box (Shuru mein hidden rahega) -->
            <div class="input-group hidden" id="otpGroup">
                <i class="fa-solid fa-key"></i>
                <input type="number" id="otp" placeholder="Enter 6-digit OTP from Email">
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Secure Login</button>
            <div id="errMsg"></div>
        </form>
    </div>

    <script>
        // 🔴 Naya: Ye check karega ki abhi Password dalna hai ya OTP
        let isOtpStep = false; 

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errMsg = document.getElementById('errMsg');
            
            errMsg.style.color = '#dc2626'; // Default lal rang error ke liye
            errMsg.innerText = ""; 

            if (!isOtpStep) {
                // ============== STEP 1: PASSWORD CHECK ==============
                btn.innerHTML = 'Checking...'; btn.disabled = true;
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;

                try {
                    const res = await fetch('/api/admin-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });
                    const result = await res.json();
                    
                    if(result.success && result.requireOtp) {
                        // Password sahi hai, ab OTP maango!
                        isOtpStep = true;
                        
                        // Purane dabbe chupao aur naya OTP dabba dikhao
                        document.getElementById('userGroup').classList.add('hidden');
                        document.getElementById('passGroup').classList.add('hidden');
                        document.getElementById('otpGroup').classList.remove('hidden');
                        
                        // OTP ko zaroori banao
                        document.getElementById('otp').required = true;
                        document.getElementById('username').required = false;
                        document.getElementById('password').required = false;
                        
                        // Button ka text badlo
                        btn.innerHTML = 'Verify OTP';
                        btn.disabled = false;
                        
                        // Success message hara (green) dikhao
                        errMsg.style.color = '#16a34a'; 
                        errMsg.innerText = "OTP sent to your Email!";
                    } else {
                        // Galat password
                        errMsg.innerText = result.message || "Incorrect Username or Password!";
                        btn.innerHTML = 'Secure Login'; btn.disabled = false;
                    }
                } catch (error) {
                    errMsg.innerText = "Server Error!";
                    btn.innerHTML = 'Secure Login'; btn.disabled = false;
                }

            } else {
                // ============== STEP 2: OTP CHECK ==============
                btn.innerHTML = 'Verifying...'; btn.disabled = true;
                const otpValue = document.getElementById('otp').value;

                try {
                    const res = await fetch('/api/admin-verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ otp: otpValue })
                    });
                    const result = await res.json();
                    
                    if(result.success) {
                        errMsg.style.color = '#16a34a';
                        errMsg.innerText = "Login Successful!";
                        window.location.href = '/admin'; // Dashboard par bhej do
                    } else {
                        errMsg.innerText = result.message || "Incorrect OTP!";
                        btn.innerHTML = 'Verify OTP'; btn.disabled = false;
                    }
                } catch (error) {
                    errMsg.innerText = "Server Error!";
                    btn.innerHTML = 'Verify OTP'; btn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
