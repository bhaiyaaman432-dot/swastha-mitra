<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Swastha Mitra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --green: #087f5b;
            --navy: #0a2540;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #153b60 100%);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); width: 100%; max-width: 350px;
            text-align: center;
        }
        .login-box i.icon-top { font-size: 50px; color: var(--green); margin-bottom: 10px; }
        .login-box h2 { color: var(--navy); margin-top: 0; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 14px; color: #94a3b8; }
        .input-group input {
            width: 100%; padding: 12px 15px 12px 45px; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
        }
        .input-group input:focus { border-color: var(--green); outline: none; }
        .btn-login {
            background: var(--green); color: white; width: 100%; padding: 12px;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-login:hover { background: var(--navy); }
        #errMsg { color: #dc2626; margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <i class="fa-solid fa-shield-halved icon-top"></i>
        <h2>Admin Portal</h2>
        
        <form id="adminLoginForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Admin Username" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Admin Password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Secure Login</button>
            <div id="errMsg"></div>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = 'Checking...'; btn.disabled = true;

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const result = await res.json();
                
                if(result.success) {
                    window.location.href = '/admin'; // Login successful, go to dashboard
                } else {
                    document.getElementById('errMsg').innerText = "Incorrect Username or Password!";
                }
            } catch (error) {
                document.getElementById('errMsg').innerText = "Server Error!";
            } finally {
                btn.innerHTML = 'Secure Login'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
