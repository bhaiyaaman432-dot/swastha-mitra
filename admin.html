<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Swastha Mitra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0e6c51;
            --light-green: #148f6d;
            --dark-navy: #0a2540;
            --bg-light: #f4f7f6;
            --text-dark: #2c3e50;
            --text-gray: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, var(--dark-navy) 0%, #153b60 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar-brand {
            padding: 25px 20px;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-brand i { color: #4ade80; font-size: 28px; }

        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
            margin: 0;
            flex: 1; /* Naya: Isse logout button niche chala jayega */
        }

        .sidebar-menu li { padding: 0 20px; margin-bottom: 10px; }

        .sidebar-menu a {
            color: #cbd5e1;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .sidebar-menu a.active, .sidebar-menu a:hover {
            background-color: rgba(255,255,255,0.1);
            color: white;
            border-left: 4px solid #4ade80;
        }

        /* NAYA: Logout Button ka CSS */
        .logout-btn { color: #fca5a5 !important; }
        .logout-btn:hover { 
            background-color: rgba(239, 68, 68, 0.1) !important; 
            border-left: 4px solid #ef4444 !important; 
            color: white !important;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-header h1 {
            margin: 0;
            color: var(--dark-navy);
            font-size: 28px;
        }

        /* --- Dashboard Stats Cards --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #e2e8f0;
            border-bottom: 4px solid var(--primary-green);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            background: #f0fdf4;
            color: var(--primary-green);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }

        .stat-card.blue .stat-icon { background: #eff6ff; color: #3b82f6; }
        .stat-card.blue { border-bottom-color: #3b82f6; }
        
        .stat-card.red .stat-icon { background: #fef2f2; color: #ef4444; }
        .stat-card.red { border-bottom-color: #ef4444; }
        
        .stat-card.gold .stat-icon { background: #fefce8; color: #eab308; }
        .stat-card.gold { border-bottom-color: #eab308; }

        .stat-info h3 { margin: 0; font-size: 26px; color: var(--dark-navy); }
        .stat-info p { margin: 5px 0 0 0; color: var(--text-gray); font-size: 14px; font-weight: 600; text-transform: uppercase;}

        /* --- Tools Row (Search & Export) --- */
        .tools-row {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 8px;
            width: 350px;
        }

        .search-box i { color: #94a3b8; margin-right: 10px; }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: var(--text-dark);
        }

        .btn-export {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-export:hover { background-color: var(--dark-navy); }

        /* --- Table Styling --- */
        .table-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        
        thead { background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        
        th { padding: 18px 20px; text-align: left; color: var(--text-gray); font-weight: 700; font-size: 13px; text-transform: uppercase; }
        
        td { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; color: var(--text-dark); font-size: 14.5px; vertical-align: middle; }
        
        tbody tr:hover { background-color: #f8fafc; }

        .mem-id { font-weight: bold; color: var(--primary-green); }

        /* Status Badges */
        .badge {
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block;
        }
        .badge-active { background: #dcfce7; color: #16a34a; }
        .badge-expired { background: #fee2e2; color: #dc2626; }
        .badge-warning { background: #fef3c7; color: #d97706; }

        /* Action Buttons */
        .action-btns { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 10px; border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-edit { background: var(--warning); }
        .btn-edit:hover { background: #d97706; }
        .btn-delete { background: var(--danger); }
        .btn-delete:hover { background: #b91c1c; }

        /* Modal Background */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
        }

        .modal {
            background: white; width: 500px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .modal h2 { margin-top: 0; color: var(--dark-navy); }
        .modal .form-group { margin-bottom: 15px; }
        .modal label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: var(--text-gray); }
        .modal input, .modal textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
        }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #94a3b8; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .btn-save { background: var(--primary-green); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-hand-holding-medical"></i> S.M. Admin
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-users"></i> All Members</a></li>
            <li><a href="/"><i class="fa-solid fa-house"></i> Go to Website</a></li>
            <li><a href="/dashboard"><i class="fa-solid fa-qrcode"></i> Digital Card Page</a></li>
            
            <!-- NAYA: LOGOUT BUTTON YAHAN ADD KIYA HAI -->
            <li style="margin-top: 50px;">
                <a href="/api/admin-logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Secure Logout</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <div class="top-header">
            <h1>Dashboard Overview</h1>
        </div>

        <!-- 4 Analytics Cards -->
        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info">
                    <h3 id="statTotal">0</h3>
                    <p>Total Members</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-user-check"></i></div>
                <div class="stat-info">
                    <h3 id="statActive">0</h3>
                    <p>Active Members</p>
                </div>
            </div>
            
            <div class="stat-card gold">
                <div class="stat-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                <div class="stat-info">
                    <h3 id="statRevenue">₹0</h3>
                    <p>Total Revenue</p>
                </div>
            </div>

            <div class="stat-card red">
                <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="stat-info">
                    <h3 id="statExpired">0</h3>
                    <p>Expired Cards</p>
                </div>
            </div>
        </div>

        <!-- Search and Export Tools -->
        <div class="tools-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by Name, Mobile or Member ID...">
            </div>
            
            <button class="btn-export" onclick="exportToExcel()">
                <i class="fa-solid fa-file-excel"></i> Download Excel
            </button>
        </div>

        <!-- Data Table -->
        <div class="table-container">
            <table id="membersTable">
                <thead>
                    <tr>
                        <th>Mem ID</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Plan & Amount</th>
                        <th>Expiry Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" style="text-align:center; padding:30px;">Loading members data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Member Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>Edit Member Details</h2>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="editMobile">
            </div>
            <div style="display:flex; gap:15px;">
                <div class="form-group" style="flex:1;">
                    <label>Age</label>
                    <input type="number" id="editAge">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Family Members</label>
                    <input type="number" id="editFamily">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="editAddress" rows="2"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let allMembers = []; // Store globally for search filtering

        // Data Load karna
        async function fetchMembers() {
            try {
                const res = await fetch("/admin/members");
                const data = await res.json();
                
                if(data.success) {
                    allMembers = data.members;
                    renderTable(allMembers);
                    calculateStats(allMembers);
                }
            } catch (error) {
                console.error("Failed to load members", error);
            }
        }

        // Stats Calculate karna (Revenue, Active, Expired)
        function calculateStats(members) {
            let totalRev = 0;
            let activeCount = 0;
            let expiredCount = 0;
            const today = new Date();

            members.forEach(m => {
                // Total Member Count
                document.getElementById('statTotal').innerText = members.length;

                // Revenue calculation (Extracting numbers from string like "₹99 (6 Months)")
                const amountMatch = m.amount_paid ? m.amount_paid.match(/₹(\d+)/) : null;
                if(amountMatch && amountMatch[1]) {
                    totalRev += parseInt(amountMatch[1]);
                }

                // Active/Expired Logic
                const expDate = new Date(m.expiry_date);
                if (expDate >= today) {
                    activeCount++;
                } else {
                    expiredCount++;
                }
            });

            document.getElementById('statRevenue').innerText = '₹' + totalRev.toLocaleString('en-IN');
            document.getElementById('statActive').innerText = activeCount;
            document.getElementById('statExpired').innerText = expiredCount;
        }

        // Table Render karna
        function renderTable(membersData) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if(membersData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No members found!</td></tr>`;
                return;
            }

            const today = new Date();

            membersData.forEach(member => {
                const expDate = new Date(member.expiry_date);
                
                // Status Badge Logic
                let badgeHTML = "";
                if (expDate < today) {
                    badgeHTML = `<span class="badge badge-expired">Expired</span>`;
                } else {
                    // Check if expiring in next 7 days
                    const diffTime = Math.abs(expDate - today);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if(diffDays <= 7) {
                        badgeHTML = `<span class="badge badge-warning">Expiring Soon</span>`;
                    } else {
                        badgeHTML = `<span class="badge badge-active">Active</span>`;
                    }
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="mem-id">${member.membership_id}</td>
                    <td style="font-weight:600;">${member.full_name}</td>
                    <td>${member.mobile}</td>
                    <td style="color:#64748b; font-size:13px;">${member.amount_paid}</td>
                    <td style="font-weight:600;">${member.expiry_date}</td>
                    <td>${badgeHTML}</td>
                    <td class="action-btns">
                        <button class="btn-sm btn-edit" onclick='openEditModal(${JSON.stringify(member)})'><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-sm btn-delete" onclick="deleteMember(${member.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Live Search Feature
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase();
            const filtered = allMembers.filter(m => 
                m.full_name.toLowerCase().includes(val) || 
                m.mobile.includes(val) || 
                m.membership_id.toLowerCase().includes(val)
            );
            renderTable(filtered);
        });

        // Edit Modal Open
        function openEditModal(member) {
            document.getElementById("editId").value = member.id;
            document.getElementById("editName").value = member.full_name;
            document.getElementById("editMobile").value = member.mobile;
            document.getElementById("editAge").value = member.age;
            document.getElementById("editFamily").value = member.family_members;
            document.getElementById("editAddress").value = member.address;
            document.getElementById("editModal").style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
        }

        // Save Edit
        async function saveEdit() {
            const id = document.getElementById("editId").value;
            const updatedData = {
                fullName: document.getElementById("editName").value,
                mobile: document.getElementById("editMobile").value,
                age: document.getElementById("editAge").value,
                familyMembers: document.getElementById("editFamily").value,
                address: document.getElementById("editAddress").value,
                email: "", 
                health: ""
            };

            const res = await fetch(`/admin/members/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedData)
            });

            if((await res.json()).success) {
                alert("Details Updated!");
                closeEditModal();
                fetchMembers();
            }
        }

        // Delete Logic
        async function deleteMember(id) {
            if(confirm("Are you sure you want to delete this member?")) {
                const res = await fetch(`/admin/members/${id}`, { method: "DELETE" });
                if((await res.json()).success) {
                    fetchMembers();
                }
            }
        }

        // Native Export to Excel (CSV Format)
        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID,Membership ID,Name,Mobile,Age,Family,Address,Amount Paid,Expiry Date\n";
            
            allMembers.forEach(m => {
                let row = `${m.id},${m.membership_id},"${m.full_name}",${m.mobile},${m.age},${m.family_members},"${m.address}","${m.amount_paid}",${m.expiry_date}`;
                csvContent += row + "\r\n";
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "SwasthaMitra_Members.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Start
        fetchMembers();
    </script>
</body>
</html>
